<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Snake</title>
<style>
  :root {
    --bg-1: #1a1c26;
    --bg-2: #0d0e14;
    --board-bg-1: #171922;
    --board-bg-2: #0c0d12;
    --grid-line: rgba(255, 255, 255, 0.04);
    --text: #eef0f5;
    --muted: #8d90a3;
    --accent: #6fb1ff;
    --accent-2: #4c8dff;
    --danger: #ff5c5c;
    --panel-bg: #23242f;
    --panel-border: rgba(255, 255, 255, 0.06);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg-1);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
  }

  body {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(111, 177, 255, 0.08), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(76, 195, 120, 0.06), transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
  }

  #app {
    width: 100%;
    height: 100%;
    max-width: 720px;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(10px, 2.4vh, 22px) clamp(12px, 3vw, 22px);
    gap: clamp(6px, 1.6vh, 14px);
  }

  #topbar {
    flex: 0 0 auto;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.1rem, 3.4vh, 1.7rem);
    letter-spacing: 3px;
    font-weight: 700;
    background: linear-gradient(180deg, #a9f0a9, #4caf50);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #status-bar {
    display: flex;
    gap: clamp(8px, 1.6vw, 14px);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 5px clamp(10px, 2vw, 16px);
    min-width: 64px;
    line-height: 1.15;
  }

  .stat .label {
    font-size: 0.62rem;
    letter-spacing: 1.5px;
    color: var(--muted);
    font-weight: 600;
  }

  .stat .value {
    font-size: clamp(1rem, 2.6vh, 1.3rem);
    font-weight: 700;
    color: var(--accent);
  }

  #best .value {
    color: #ffd479;
  }

  #level .value {
    color: #c48bff;
  }

  #level.level-up {
    animation: level-flash 0.7s ease-out;
  }

  @keyframes level-flash {
    0% {
      transform: scale(1);
      box-shadow: 0 0 0 rgba(196, 139, 255, 0);
      border-color: var(--panel-border);
    }
    30% {
      transform: scale(1.15);
      box-shadow: 0 0 18px rgba(196, 139, 255, 0.7);
      border-color: #c48bff;
    }
    100% {
      transform: scale(1);
      box-shadow: 0 0 0 rgba(196, 139, 255, 0);
      border-color: var(--panel-border);
    }
  }

  #board-wrap {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #board-frame {
    position: relative;
    border-radius: 16px;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.06),
      0 20px 50px rgba(0, 0, 0, 0.45),
      0 0 60px rgba(76, 195, 120, 0.08);
  }

  #board {
    display: block;
    border-radius: 16px;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(8, 9, 13, 0.78);
    backdrop-filter: blur(3px);
    border-radius: 16px;
    text-align: center;
    padding: 16px;
  }

  #overlay.visible {
    display: flex;
  }

  #overlay h2 {
    margin: 0;
    color: var(--danger);
    font-size: clamp(1.4rem, 4.5vh, 2.1rem);
    letter-spacing: 2px;
    text-shadow: 0 0 24px rgba(255, 92, 92, 0.5);
  }

  #overlay p {
    margin: 0;
    font-size: clamp(0.9rem, 2.2vh, 1.1rem);
    color: var(--text);
  }

  #overlay .hint {
    font-size: 0.8rem;
    color: var(--muted);
  }

  #restart-btn {
    margin-top: 6px;
    padding: 10px 28px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #0d1f12;
    background: linear-gradient(180deg, #8be28b, #4caf50);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(76, 195, 120, 0.35);
    transition: transform 0.08s ease, box-shadow 0.15s ease;
  }

  #restart-btn:hover {
    box-shadow: 0 8px 20px rgba(76, 195, 120, 0.5);
    transform: translateY(-1px);
  }

  #restart-btn:active {
    transform: translateY(0);
    box-shadow: 0 4px 10px rgba(76, 195, 120, 0.35);
  }

  #instructions {
    flex: 0 0 auto;
    width: 100%;
    text-align: center;
    font-size: clamp(0.68rem, 1.6vh, 0.82rem);
    color: var(--muted);
    line-height: 1.4;
    margin: 0;
  }

  #instructions kbd {
    display: inline-block;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    color: var(--text);
  }
</style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <h1>SNAKE</h1>
      <div id="status-bar">
        <div class="stat" id="score-stat">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="stat" id="level">
          <span class="label">LEVEL</span>
          <span class="value" id="level-value">1</span>
        </div>
        <div class="stat" id="best">
          <span class="label">BEST</span>
          <span class="value" id="best-value">0</span>
        </div>
      </div>
    </div>

    <div id="board-wrap">
      <div id="board-frame">
        <canvas id="board"></canvas>
        <div id="overlay">
          <h2>GAME OVER</h2>
          <p id="final-score">Score: 0</p>
          <button id="restart-btn">Restart</button>
          <span class="hint">or press Enter</span>
        </div>
      </div>
    </div>

    <p id="instructions">
      <kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&larr;</kbd> <kbd>&rarr;</kbd> to move &nbsp;&middot;&nbsp;
      eat the food to grow &nbsp;&middot;&nbsp; avoid walls and yourself
    </p>
  </div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var boardFrame = document.getElementById("board-frame");
  var boardWrap = document.getElementById("board-wrap");
  var scoreEl = document.getElementById("score");
  var levelEl = document.getElementById("level-value");
  var levelStatEl = document.getElementById("level");
  var bestEl = document.getElementById("best-value");
  var overlayEl = document.getElementById("overlay");
  var finalScoreEl = document.getElementById("final-score");
  var restartBtn = document.getElementById("restart-btn");

  var GRID_SIZE = 20;
  var CELL = 24;

  // Speed progression: level is always derived from score (never stored or
  // set independently), so it can never start or land on a stale/wrong
  // value. Each level eases the tick interval down by a fixed percentage of
  // what's left, giving a very slow start and a floor so it never becomes
  // impossibly fast.
  var POINTS_PER_LEVEL = 500;
  var BASE_TICK_MS = 260;   // Level 1: very slow, ~3.8 moves/sec.
  var LEVEL_DECAY = 0.90;   // Each level is ~10% faster than the previous.
  var MIN_TICK_MS = 90;     // Floor: fast but still fully controllable.

  var snake, direction, nextDirection, food, score, best, level, gameOver, timerId;

  function levelForScore(s) {
    return Math.floor(s / POINTS_PER_LEVEL) + 1;
  }

  function tickIntervalForLevel(lvl) {
    var raw = BASE_TICK_MS * Math.pow(LEVEL_DECAY, lvl - 1);
    return Math.max(MIN_TICK_MS, Math.round(raw));
  }

  function startTimer() {
    if (timerId) {
      clearInterval(timerId);
    }
    timerId = setInterval(tick, tickIntervalForLevel(level));
  }

  var BODY_NEAR = [123, 214, 130];
  var BODY_FAR = [30, 100, 66];

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function lerpColor(c1, c2, t) {
    return "rgb(" +
      Math.round(lerp(c1[0], c2[0], t)) + "," +
      Math.round(lerp(c1[1], c2[1], t)) + "," +
      Math.round(lerp(c1[2], c2[2], t)) + ")";
  }

  function loadBest() {
    try {
      var v = localStorage.getItem("snake_best_score");
      return v ? parseInt(v, 10) || 0 : 0;
    } catch (e) {
      return 0;
    }
  }

  function saveBest(v) {
    try {
      localStorage.setItem("snake_best_score", String(v));
    } catch (e) {
      /* ignore storage errors (e.g. file:// restrictions) */
    }
  }

  function randomCell() {
    return {
      x: Math.floor(Math.random() * GRID_SIZE),
      y: Math.floor(Math.random() * GRID_SIZE)
    };
  }

  function placeFood() {
    var cell;
    var onSnake;
    do {
      cell = randomCell();
      onSnake = snake.some(function (seg) {
        return seg.x === cell.x && seg.y === cell.y;
      });
    } while (onSnake);
    return cell;
  }

  function resetGame() {
    var startX = Math.floor(GRID_SIZE / 2);
    var startY = Math.floor(GRID_SIZE / 2);

    snake = [
      { x: startX - 1, y: startY },
      { x: startX - 2, y: startY },
      { x: startX - 3, y: startY }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    level = levelForScore(score);
    gameOver = false;

    food = placeFood();

    scoreEl.textContent = String(score);
    levelEl.textContent = String(level);
    levelStatEl.classList.remove("level-up");
    best = loadBest();
    bestEl.textContent = String(best);

    overlayEl.classList.remove("visible");

    startTimer();

    draw();
  }

  function endGame() {
    gameOver = true;
    clearInterval(timerId);
    if (score > best) {
      best = score;
      saveBest(best);
      bestEl.textContent = String(best);
    }
    finalScoreEl.textContent = "Score: " + score;
    overlayEl.classList.add("visible");
  }

  function tick() {
    direction = nextDirection;

    var head = snake[0];
    var newHead = { x: head.x + direction.x, y: head.y + direction.y };

    if (
      newHead.x < 0 ||
      newHead.x >= GRID_SIZE ||
      newHead.y < 0 ||
      newHead.y >= GRID_SIZE
    ) {
      endGame();
      return;
    }

    var ateFood = newHead.x === food.x && newHead.y === food.y;

    // Exclude the current tail cell when it's about to move away (no growth
    // this tick); otherwise a tight loop equal to the snake's own length
    // would falsely register as self-collision.
    var bodyToCheck = ateFood ? snake : snake.slice(0, snake.length - 1);
    var hitsSelf = bodyToCheck.some(function (seg) {
      return seg.x === newHead.x && seg.y === newHead.y;
    });
    if (hitsSelf) {
      endGame();
      return;
    }

    snake.unshift(newHead);

    if (ateFood) {
      score += 10;
      scoreEl.textContent = String(score);
      food = placeFood();

      var newLevel = levelForScore(score);
      if (newLevel !== level) {
        level = newLevel;
        levelEl.textContent = String(level);
        startTimer();
        levelStatEl.classList.remove("level-up");
        // restart the CSS animation
        void levelStatEl.offsetWidth;
        levelStatEl.classList.add("level-up");
      }
    } else {
      snake.pop();
    }

    draw();
  }

  // ---- Rendering ----

  function cellCenter(seg) {
    return { x: seg.x * CELL + CELL / 2, y: seg.y * CELL + CELL / 2 };
  }

  function radiusAt(idx, n) {
    var maxR = CELL * 0.46;
    var minR = CELL * 0.16;
    var t = n <= 1 ? 0 : idx / (n - 1);
    var eased = Math.pow(t, 1.4);
    return maxR - (maxR - minR) * eased;
  }

  function drawBoard() {
    var size = CELL * GRID_SIZE;
    var bgGrad = ctx.createLinearGradient(0, 0, 0, size);
    bgGrad.addColorStop(0, "#181a24");
    bgGrad.addColorStop(1, "#0b0c11");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, size, size);

    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    for (var i = 1; i < GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, size);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(size, i * CELL);
      ctx.stroke();
    }
  }

  function drawFood() {
    var c = cellCenter(food);
    var r = CELL * 0.34;

    ctx.beginPath();
    ctx.ellipse(c.x, c.y + r * 0.8, r * 0.75, r * 0.22, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fill();

    var grad = ctx.createRadialGradient(
      c.x - r * 0.35, c.y - r * 0.35, r * 0.1,
      c.x, c.y, r
    );
    grad.addColorStop(0, "#ffb3b3");
    grad.addColorStop(0.55, "#ff5c5c");
    grad.addColorStop(1, "#c62828");

    ctx.beginPath();
    ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(c.x - r * 0.35, c.y - r * 0.4, r * 0.24, r * 0.14, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fill();

    ctx.strokeStyle = "#5b3a21";
    ctx.lineWidth = Math.max(1.5, r * 0.18);
    ctx.beginPath();
    ctx.moveTo(c.x, c.y - r * 0.95);
    ctx.lineTo(c.x + r * 0.2, c.y - r * 1.4);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(c.x + r * 0.5, c.y - r * 1.15, r * 0.26, r * 0.13, -0.5, 0, Math.PI * 2);
    ctx.fillStyle = "#4caf50";
    ctx.fill();
  }

  function drawSnakeBody() {
    var n = snake.length;

    for (var i = n - 1; i >= 1; i--) {
      var a = cellCenter(snake[i]);
      var b = cellCenter(snake[i - 1]);
      var rA = radiusAt(i, n);
      var rB = radiusAt(i - 1, n);
      var t = i / (n - 1 || 1);

      ctx.strokeStyle = lerpColor(BODY_NEAR, BODY_FAR, t);
      ctx.lineWidth = rA + rB;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    var tailC = cellCenter(snake[n - 1]);
    ctx.beginPath();
    ctx.arc(tailC.x, tailC.y, radiusAt(n - 1, n), 0, Math.PI * 2);
    ctx.fillStyle = lerpColor(BODY_NEAR, BODY_FAR, 1);
    ctx.fill();

    if (n > 2) {
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = "#0f3d24";
      ctx.lineWidth = Math.max(1, CELL * 0.055);
      for (var j = 1; j < n - 1; j++) {
        var prev = snake[j - 1], curr = snake[j], next = snake[j + 1];
        var dx = next.x - prev.x, dy = next.y - prev.y;
        var len = Math.hypot(dx, dy) || 1;
        var px = -dy / len, py = dx / len;
        var cc = cellCenter(curr);
        var rr = radiusAt(j, n) * 0.85;
        ctx.beginPath();
        ctx.moveTo(cc.x - px * rr, cc.y - py * rr);
        ctx.lineTo(cc.x + px * rr, cc.y + py * rr);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawEye(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = "#0e0e12";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fill();
  }

  function drawHead() {
    var n = snake.length;
    var c = cellCenter(snake[0]);
    var rHead = radiusAt(0, n) * 1.05;
    var angle = Math.atan2(direction.y, direction.x);

    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(angle);

    var lenF = rHead * 1.35;
    var lenB = rHead * 1.05;
    var w = rHead * 1.05;

    ctx.beginPath();
    ctx.moveTo(lenF, 0);
    ctx.quadraticCurveTo(lenF, w, lenF * 0.3, w);
    ctx.lineTo(-lenB * 0.6, w * 0.9);
    ctx.quadraticCurveTo(-lenB, w * 0.5, -lenB, 0);
    ctx.quadraticCurveTo(-lenB, -w * 0.5, -lenB * 0.6, -w * 0.9);
    ctx.lineTo(lenF * 0.3, -w);
    ctx.quadraticCurveTo(lenF, -w, lenF, 0);
    ctx.closePath();

    var headGrad = ctx.createLinearGradient(-lenB, 0, lenF, 0);
    headGrad.addColorStop(0, lerpColor(BODY_NEAR, BODY_FAR, 0));
    headGrad.addColorStop(1, "#9be89b");
    ctx.fillStyle = headGrad;
    ctx.fill();

    if (!gameOver) {
      ctx.strokeStyle = "#e34d4d";
      ctx.lineWidth = Math.max(1.2, rHead * 0.12);
      ctx.beginPath();
      ctx.moveTo(lenF * 0.95, 0);
      ctx.lineTo(lenF * 1.45, 0);
      ctx.moveTo(lenF * 1.45, 0);
      ctx.lineTo(lenF * 1.7, -rHead * 0.28);
      ctx.moveTo(lenF * 1.45, 0);
      ctx.lineTo(lenF * 1.7, rHead * 0.28);
      ctx.stroke();
    }

    var eyeR = rHead * 0.22;
    var eyeX = lenF * 0.35;
    var eyeY = w * 0.55;
    drawEye(eyeX, -eyeY, eyeR);
    drawEye(eyeX, eyeY, eyeR);

    ctx.restore();
  }

  function draw() {
    drawBoard();
    drawFood();
    drawSnakeBody();
    drawHead();
  }

  // ---- Responsive canvas sizing ----

  function layoutBoard() {
    var rect = boardWrap.getBoundingClientRect();
    var size = Math.floor(Math.min(rect.width, rect.height));
    size = Math.max(size, 180);

    var dpr = window.devicePixelRatio || 1;

    boardFrame.style.width = size + "px";
    boardFrame.style.height = size + "px";

    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    CELL = size / GRID_SIZE;

    if (snake) {
      draw();
    }
  }

  var resizeQueued = false;
  window.addEventListener("resize", function () {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(function () {
      resizeQueued = false;
      layoutBoard();
    });
  });

  // ---- Input ----

  var KEY_MAP = {
    ArrowUp: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }
  };

  window.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && gameOver) {
      resetGame();
      return;
    }

    var dir = KEY_MAP[e.key];
    if (!dir) return;

    e.preventDefault();

    if (gameOver) return;

    var isReverse =
      dir.x === -direction.x && dir.y === -direction.y && snake.length > 1;
    if (isReverse) return;

    nextDirection = dir;
  });

  restartBtn.addEventListener("click", resetGame);

  layoutBoard();
  resetGame();
})();
</script>
</body>
</html>
